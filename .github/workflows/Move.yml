name: Move doom-ps to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-to-root:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move doom-ps contents to root
        shell: bash
        run: |
          set -e

          if [ ! -d "doom-ps" ]; then
            echo "ERROR: doom-ps directory does not exist."
            exit 1
          fi

          echo "Moving project files from doom-ps to repository root..."

          # Move everything EXCEPT .github
          find doom-ps -mindepth 1 -maxdepth 1 ! -name ".github" -exec cp -a {} ./ \;

          # Remove the old doom-ps directory
          rm -rf doom-ps

          echo ""
          echo "Final repository structure:"
          find . -maxdepth 3 -not -path "./.git*" -print | sort

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Move doom-ps project to repository root"

      - name: Push changes
        run: |
          git push
