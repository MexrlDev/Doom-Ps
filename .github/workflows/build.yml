name: Build doom-ps

# Manual
on:
  workflow_dispatch:
    inputs:
      doomgeneric_ref:
        description: "doomgeneric ref (branch/tag/commit)"
        required: false
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git binutils file python3

      - name: Verify toolchain
        run: |
          gcc     --version | head -n1
          objcopy --version | head -n1
          make    --version | head -n1
          python3 --version

      - name: Clone doomgeneric
        run: |
          git clone --depth=1 --branch "${{ inputs.doomgeneric_ref }}" \
            https://github.com/ozkl/doomgeneric doomgeneric
          git -C doomgeneric log -1 --oneline

      - name: Build
        run: make -j"$(nproc)"

      - name: Hex payload
        run: make hex

      - name: Inspect artifacts
        run: |
          ls -lh doom_ps.elf doom_ps.bin doom_ps.hex
          echo "---- ELF header ----"      ; readelf -h doom_ps.elf
          echo "---- Program headers ----" ; readelf -l doom_ps.elf
          echo "---- Section headers ----" ; readelf -S doom_ps.elf
          echo "---- Hex size ----"        ; wc -c doom_ps.hex

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Doom-Ps
          path: |
            doom_ps.elf
            doom_ps.bin
            doom_ps.hex
          if-no-files-found: error
          retention-days: 30
