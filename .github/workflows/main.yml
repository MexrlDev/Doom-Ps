name: Extract ZIP to Root

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP contents directly into root
        shell: bash
        run: |
          set -e

          shopt -s nullglob
          zips=(./*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 0
          fi

          for zip in "${zips[@]}"; do
            echo "Processing: $zip"

            TEMP_DIR="$(mktemp -d)"

            # Extract ZIP into temporary directory
            unzip -q "$zip" -d "$TEMP_DIR"

            # If the ZIP contains exactly one top-level directory,
            # extract the CONTENTS of that directory into the repo root.
            entries=("$TEMP_DIR"/*)

            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              TOP_DIR="${entries[0]}"

              echo "Top-level folder detected: $(basename "$TOP_DIR")"
              echo "Moving its contents into repository root..."

              # The /* is intentional:
              # copy the CONTENTS, not the folder itself.
              cp -a "$TOP_DIR"/. ./
            else
              echo "No single top-level folder detected."
              echo "Copying archive contents directly into repository root..."

              cp -a "$TEMP_DIR"/. ./
            fi

            # Remove temporary extraction directory
            rm -rf "$TEMP_DIR"

            # Delete the original ZIP
            rm -f "$zip"

            echo "Done: $zip"
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract ZIP contents to root"
          git push
