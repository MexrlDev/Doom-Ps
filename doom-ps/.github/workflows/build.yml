name: Build doom-ps

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git xxd

      - name: Clone doomgeneric
        run: |
          git clone --depth=1 https://github.com/ozkl/doomgeneric doomgeneric
          echo "=== doomgeneric source files ==="
          ls doomgeneric/doomgeneric/*.c

      - name: Build
        run: make -j$(nproc)

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -lah doom_ps.elf doom_ps.bin
          file doom_ps.elf doom_ps.bin
          echo ""
          echo "=== ELF sections ==="
          readelf -S doom_ps.elf | head -25
          echo ""
          echo "=== Binary size ==="
          wc -c doom_ps.bin

      - name: Generate Lua hex string
        run: |
          echo "=== Lua hex (paste into doom_launcher.lua) ==="
          make hex | tee doom_ps.hex
          echo "Hex length: $(wc -c < doom_ps.hex) chars"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doom-ps-build
          path: |
            doom_ps.elf
            doom_ps.bin
            doom_ps.hex
          if-no-files-found: error
          retention-days: 30
